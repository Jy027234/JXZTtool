name: parsecore-starter

services:
  parsecore-postgres:
    image: pgvector/pgvector:pg16
    profiles: ["pgvector"]
    environment:
      POSTGRES_DB: parsecore
      POSTGRES_USER: parsecore
      POSTGRES_PASSWORD: parsecore
    ports:
      - "5432:5432"
    volumes:
      - parsecore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parsecore -d parsecore"]
      interval: 5s
      timeout: 5s
      retries: 20

  parsecore-api:
    build:
      context: .
    command:
      [
        "python",
        "-m",
        "parsecore.cli",
        "serve",
        "--config",
        "/app/parsecore.runtime.toml",
        "--host",
        "0.0.0.0",
        "--port",
        "8090",
      ]
    ports:
      - "8090:8090"
    volumes:
      - ./var:/app/var
      - ${PARSECORE_RUNTIME_CONFIG:-./parsecore.queue.toml}:/app/parsecore.runtime.toml:ro

  parsecore-worker:
    build:
      context: .
    command:
      [
        "python",
        "-m",
        "parsecore.cli",
        "worker",
        "--config",
        "/app/parsecore.runtime.toml",
      ]
    volumes:
      - ./var:/app/var
      - ${PARSECORE_RUNTIME_CONFIG:-./parsecore.queue.toml}:/app/parsecore.runtime.toml:ro

volumes:
  parsecore-postgres-data:
