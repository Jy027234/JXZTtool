[project]
name = "parsecore-starter"
mode = "embedded-sdk"

[runtime]
execution_mode = "inline"
max_workers = 2
# 0 = auto(max_workers * 4), set explicit value to cap in-flight jobs
max_inflight_jobs = 0
max_active_parts_per_doc = 0
job_timeout_seconds = 0
part_timeout_seconds = 0
retry_backoff_seconds = 1.0
retry_backoff_max_seconds = 60.0
poll_interval_ms = 500
# Optional API ingress auth. When enabled, every HTTP endpoint except /health
# requires x-api-key or Authorization: Bearer with the secret from this env var.
# api_key_env = "PARSECORE_API_KEY"
# 50 MiB request file guard for /parse and /parse/batch; set 0 to disable.
max_upload_bytes = 52428800
# Optional guard for /parse/uploads and /v1/parse/uploads; 0 keeps the async bridge open for large files.
staged_upload_max_bytes = 0
# Keep /v1/parse/jobs from reading arbitrary host paths. Use /parse/uploads or
# place server-side files under storage.object_store when this is false.
allow_external_file_paths = false
# Enforce quota units at submission time.
quota_enforce = false
quota_window_hours = 24
quota_default_limit_units = 0
# [runtime.quota_limits]
# "tenant-a:starter" = 200
# "tenant-a:*" = 500
# "*:*" = 1000
max_attempts = 3
log_path = "var/logs/job_events.jsonl"

[storage]
database_url = "sqlite:///./var/parsecore.db"
object_store = "local://./var/uploads"

[index]
mode = "hybrid"

[translation]
enabled = true
strategy = "lazy"

[product]
adapter = "embedded"

[quality_gate]
enabled = true
min_text_page_coverage = 0.98
min_table_unit_coverage = 0.95
min_unit_chunk_coverage = 0.98
min_reading_order_confidence = 0.75
allow_local_rerun = true
allow_manual_review = true

# Optional: LLM provider for semantic block-boundary refinement (A4).
# Embedded-SDK mode: when ParseCore is hosted by another application, the host
# should override these via its own config and inject the API key through the
# referenced env var instead of writing it here.
[providers.llm]
enabled = false
provider = "qwen-dashscope"
model = "qwen3.6-35b-a3b"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "PARSECORE_LLM_API_KEY"
timeout_seconds = 30.0
max_retries = 2
# options.temperature = 0.0
# options.top_p = 0.1

[providers.embedding]
enabled = false
provider = "openai-compatible"
model = "text-embedding-3-small"
base_url = "https://api.openai.com/v1"
api_key_env = "PARSECORE_EMBEDDING_API_KEY"
timeout_seconds = 30.0
max_retries = 2
batch_size = 16
# options.dimensions = 1536

# Optional second-stage document retrieval reranker.  It is disabled by
# default and does not alter parser routing or baseline search results until
# a deployment explicitly provides a compatible endpoint and credential.
[providers.rerank]
enabled = false
provider = "dashscope-compatible"
model = "qwen/qwen3-vl-rerank"
base_url = ""
api_key_env = "PARSECORE_RERANK_API_KEY"
timeout_seconds = 30.0
max_retries = 2
# Candidates are collected by the existing hybrid retrieval before reranking.
candidate_limit = 30
# options = { enable_truncation = true }

# OCR provider abstraction used by image-ocr parser and PDF bad-page fallback.
# Set enabled = false to keep the image-ocr parser registered but report OCR
# unavailable and skip PDF OCR fallback recovery.
[providers.ocr]
enabled = true
provider = "rapidocr"
# To reuse a host OCR gateway instead of local RapidOCR, switch to:
# provider = "remote-http"
# base_url = "https://ocr.example.com"
# api_key_env = "PARSECORE_OCR_API_KEY"
# timeout_seconds = 10.0
# max_retries = 2
# options = { endpoint_path = "/ocr/v1", headers = { "X-OCR-Tenant" = "tenant-a" } }
# options.det_use_dilation = true

# Local Provider Registry declares built-in and candidate local parsers for
# IR/coverage planning. Disabled entries are discoverable but not used until
# a matching adapter is implemented and enabled.
[providers.local_parser_routing]
enabled = false
fallback_to_default = true
include_disabled = false

[[providers.local_parsers]]
id = "pdf-text"
enabled = true
priority = 100
media_types = ["application/pdf"]
extensions = [".pdf"]
profiles = ["default", "table-heavy", "large-pdf", "large-pdf-catalog", "large-pdf-ledger"]
capabilities = ["native-text", "layout", "tables", "local-ocr-fallback"]
route_mode = "route"
gate_status = "passed"
gate_checks = ["samples", "license", "performance", "observability"]

[[providers.local_parsers]]
id = "docx-native"
enabled = true
priority = 100
media_types = ["application/vnd.openxmlformats-officedocument.wordprocessingml.document"]
extensions = [".docx"]
profiles = ["default"]
capabilities = ["native-structure", "tables", "lists"]
route_mode = "route"
gate_status = "passed"
gate_checks = ["samples", "license", "performance", "observability"]

[[providers.local_parsers]]
id = "excel-native"
enabled = true
priority = 100
media_types = [
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    "application/vnd.ms-excel.sheet.macroEnabled.12",
    "application/vnd.ms-excel",
]
extensions = [".xlsx", ".xlsm", ".xls"]
profiles = ["default", "excel-ledger"]
capabilities = ["sheets", "records", "merged-cells"]
route_mode = "route"
gate_status = "passed"
gate_checks = ["samples", "license", "performance", "observability"]

[[providers.local_parsers]]
id = "pymupdf4llm-local"
enabled = false
priority = 80
media_types = ["application/pdf"]
extensions = [".pdf"]
profiles = ["default", "table-heavy"]
capabilities = ["markdown", "json", "rag-baseline"]
route_mode = "evaluate"
gate_status = "pending"
gate_checks = ["samples", "license", "performance", "observability"]

[[providers.local_parsers]]
id = "docling-local"
enabled = false
priority = 70
media_types = [
    "application/pdf",
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
]
extensions = [".pdf", ".docx"]
profiles = ["default", "table-heavy", "scan-pdf"]
capabilities = ["layout", "tables", "reading-order"]
route_mode = "evaluate"
gate_status = "pending"
gate_checks = ["samples", "license", "performance", "observability"]

[[providers.local_parsers]]
id = "mineru-local"
enabled = false
priority = 60
media_types = ["application/pdf"]
extensions = [".pdf"]
profiles = ["scan-pdf", "table-heavy"]
capabilities = ["layout", "tables", "formula", "local-model"]
route_mode = "evaluate"
gate_status = "pending"
gate_checks = ["samples", "license", "performance", "observability"]

[[parsers]]
name = "docx-native"
media_types = ["application/vnd.openxmlformats-officedocument.wordprocessingml.document"]
extensions = [".docx"]

[[parsers]]
name = "pdf-text"
media_types = ["application/pdf"]
extensions = [".pdf"]
# 可选后处理配置（默认值如下；调整需谨慎，建议先用
# tools/min_length_scan.py 跑一次灵敏度扫描后再改 short_block_min_length）
# 注意：A3+.1 起，strip_headers_footers 默认 false（保留完整页面内容）。
# 需要去掉跨页重复页眉页脚时显式开启：
#   options.post_process = { strip_headers_footers = true }
# options.post_process = { strip_headers_footers = false, merge_short_blocks = true, short_block_min_length = 10, hf_threshold = 0.5, hf_head_n = 3, hf_tail_n = 3, hf_min_line_len = 4, split_structural_items = true, structural_min_lines_trigger = 10, split_inline_structural_items = true, inline_structural_min_length_trigger = 120, split_toc_entries = true, toc_min_entries_trigger = 3, merge_table_continuations = true, merge_highlights_entries = true }
# A3 双通道：开启后用 pdfplumber 抽取表格 + 去表格区域文本，pypdf 仍走原管线
[parsers.options.post_process]
dual_channel = true
layout_reading_order = true
# A3+.1 自适应版面解析：仅对含表格/图示/多列/OCR 信号的页面运行
# pdfplumber，其余页面保留 pypdf 原生文本路径。显式请求 dual_channel 或
# layout_reading_order 时仍会回退到全量高保真解析。
adaptive_dual_channel = true
adaptive_dual_channel_max_page_ratio = 0.85
adaptive_dual_channel_min_pages = 8
adaptive_ocr_cache_fast_path = true
# Reuse immutable parser blocks for same-file retries/reparses in this worker.
# The cache key includes source fingerprint, tenant/document identity, and
# request options; the small LRU bound keeps memory predictable.
parse_cache = true
parse_cache_max_entries = 2
dual_table_min_rows = 2
dual_table_min_cols = 2
ocr_bad_pages = true
ocr_bad_page_min_cid_tokens = 5
ocr_bad_page_min_cid_char_ratio = 0.25
ocr_render_resolution = 110
ocr_confidence_threshold = 0.5
ocr_merge_line_gap_ratio = 1.6

# P2 shadow adapters are registered so the comparison command can execute them
# explicitly. Their provider admission remains disabled/evaluate above, so they
# can never be selected by the default parse route.
[[parsers]]
name = "pymupdf4llm-local"
media_types = ["application/pdf"]
extensions = [".pdf"]
options = { page_chunks = true, detect_tables = true }

[[parsers]]
name = "docling-local"
media_types = ["application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]
extensions = [".pdf", ".docx"]
# Candidate-only warm profile: reuse the converter across part retries in a
# long-lived worker.  The provider remains disabled/evaluate above.
options = { detect_tables = true, reuse_converter = true }

[[parsers]]
name = "image-ocr"
media_types = ["image/png", "image/jpeg"]
extensions = [".png", ".jpg", ".jpeg"]

[[parsers]]
name = "excel-native"
media_types = [
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    "application/vnd.ms-excel.sheet.macroEnabled.12",
    "application/vnd.ms-excel",
]
extensions = [".xlsx", ".xlsm", ".xls"]
# options.max_rows_per_sheet = 5000
# options.max_cols_per_sheet = 100
# options.max_metadata_cells = 1000
# options.include_hidden_sheets = true

[[parsers]]
name = "text-native"
media_types = ["text/plain"]
extensions = [".txt", ".md"]
