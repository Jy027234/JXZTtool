name: ParseCore CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read

jobs:
  fast:
    name: Fast self-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,parsers,storage]"
      - name: Detect fast regression corpus
        id: fast-corpus
        run: |
          python tools/corpus_manifest.py \
            --suite var/regression/suite.fast.json \
            --github-output "$GITHUB_OUTPUT" \
            --out "$RUNNER_TEMP/parsecore-corpus.fast.json"
      - name: Record fast corpus status
        run: |
          {
            echo "### Fast regression corpus: \`${{ steps.fast-corpus.outputs.status }}\`"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| available | \`${{ steps.fast-corpus.outputs.available }}\` |"
            echo "| verified | \`${{ steps.fast-corpus.outputs.verified }}\` |"
            echo "| reason | \`${{ steps.fast-corpus.outputs.reason }}\` |"
            echo "| entries verified | ${{ steps.fast-corpus.outputs.verified_entries }} / ${{ steps.fast-corpus.outputs.selected_entries }} selected (${{ steps.fast-corpus.outputs.entry_count }} total) |"
            echo "| missing entries / fixtures | ${{ steps.fast-corpus.outputs.missing_entries }} / ${{ steps.fast-corpus.outputs.missing_fixtures }} |"
            echo "| empty / hash_drift / error entries | ${{ steps.fast-corpus.outputs.empty_entries }} / ${{ steps.fast-corpus.outputs.hash_drift_entries }} / ${{ steps.fast-corpus.outputs.error_entries }} |"
            echo "| disabled / skipped entries | ${{ steps.fast-corpus.outputs.disabled_entries }} / ${{ steps.fast-corpus.outputs.skipped_entries }} |"
            echo "| manifest | \`${{ runner.temp }}/parsecore-corpus.fast.json\` |"
            echo ""
            if [ "${{ steps.fast-corpus.outputs.available }}" != "true" ]; then
              echo "**Verification status: UNVERIFIED.** The regression quality gate is NOT exercised on this runner; this fast run is a smoke check and cannot be used as release acceptance evidence."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.fast-corpus.outputs.available }}" != "true" ]; then
            echo "::notice::Fast regression corpus unavailable (reason=${{ steps.fast-corpus.outputs.reason }}): ${{ steps.fast-corpus.outputs.summary }} - falling back to smoke; this run is recorded as UNVERIFIED."
          fi
      - name: Run fast gate
        if: steps.fast-corpus.outputs.available == 'true'
        run: python tools/self_check.py --profile fast --out "$RUNNER_TEMP/parsecore-self-check-fast.json"
      - name: Run fast smoke fallback (unverified)
        if: steps.fast-corpus.outputs.available != 'true'
        run: |
          python tools/self_check.py --skip-regression --out "$RUNNER_TEMP/parsecore-self-check-fast.json"
          echo "::warning::Fast lane ran in smoke mode: the regression quality gate was NOT exercised (corpus reason=${{ steps.fast-corpus.outputs.reason }}). Release acceptance requires --require-verified-corpus."
      - name: Verify optional API boundary
        run: python -m unittest tests.test_package_imports

  regression:
    name: Full self-check
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,parsers,storage]"
      - name: Detect full regression corpus
        id: full-corpus
        run: |
          python tools/corpus_manifest.py \
            --suite var/regression/suite.full.json \
            --github-output "$GITHUB_OUTPUT" \
            --out "$RUNNER_TEMP/parsecore-corpus.full.json"
      - name: Record full corpus status
        run: |
          {
            echo "### Full regression corpus: \`${{ steps.full-corpus.outputs.status }}\`"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| available | \`${{ steps.full-corpus.outputs.available }}\` |"
            echo "| verified | \`${{ steps.full-corpus.outputs.verified }}\` |"
            echo "| reason | \`${{ steps.full-corpus.outputs.reason }}\` |"
            echo "| entries verified | ${{ steps.full-corpus.outputs.verified_entries }} / ${{ steps.full-corpus.outputs.selected_entries }} selected (${{ steps.full-corpus.outputs.entry_count }} total) |"
            echo "| missing entries / fixtures | ${{ steps.full-corpus.outputs.missing_entries }} / ${{ steps.full-corpus.outputs.missing_fixtures }} |"
            echo "| empty / hash_drift / error entries | ${{ steps.full-corpus.outputs.empty_entries }} / ${{ steps.full-corpus.outputs.hash_drift_entries }} / ${{ steps.full-corpus.outputs.error_entries }} |"
            echo "| disabled / skipped entries | ${{ steps.full-corpus.outputs.disabled_entries }} / ${{ steps.full-corpus.outputs.skipped_entries }} |"
            echo "| manifest | \`${{ runner.temp }}/parsecore-corpus.full.json\` |"
            echo ""
            if [ "${{ steps.full-corpus.outputs.available }}" != "true" ]; then
              echo "**Verification status: UNVERIFIED.** The full regression gate is skipped on this runner."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.full-corpus.outputs.available }}" != "true" ]; then
            echo "::notice::Full regression corpus unavailable (reason=${{ steps.full-corpus.outputs.reason }}): ${{ steps.full-corpus.outputs.summary }} - full gate skipped and recorded as UNVERIFIED."
          fi
      - name: Run full gate
        if: steps.full-corpus.outputs.available == 'true'
        run: python tools/self_check.py --profile slow --out "$RUNNER_TEMP/parsecore-self-check-full.json"
      - name: Skip full gate (unverified)
        if: steps.full-corpus.outputs.available != 'true'
        run: echo "Full regression corpus unavailable (reason=${{ steps.full-corpus.outputs.reason }}); skipped and recorded as UNVERIFIED in the job summary."

  performance:
    name: Performance tracking
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,parsers,storage]"
      - name: Detect performance regression corpus
        id: perf-corpus
        run: |
          python tools/corpus_manifest.py \
            --suite var/regression/suite.perf.json \
            --github-output "$GITHUB_OUTPUT" \
            --out "$RUNNER_TEMP/parsecore-corpus.perf.json"
      - name: Record perf corpus status
        run: |
          {
            echo "### Performance regression corpus: \`${{ steps.perf-corpus.outputs.status }}\`"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| available | \`${{ steps.perf-corpus.outputs.available }}\` |"
            echo "| verified | \`${{ steps.perf-corpus.outputs.verified }}\` |"
            echo "| reason | \`${{ steps.perf-corpus.outputs.reason }}\` |"
            echo "| entries verified | ${{ steps.perf-corpus.outputs.verified_entries }} / ${{ steps.perf-corpus.outputs.selected_entries }} selected (${{ steps.perf-corpus.outputs.entry_count }} total) |"
            echo "| missing entries / fixtures | ${{ steps.perf-corpus.outputs.missing_entries }} / ${{ steps.perf-corpus.outputs.missing_fixtures }} |"
            echo "| empty / hash_drift / error entries | ${{ steps.perf-corpus.outputs.empty_entries }} / ${{ steps.perf-corpus.outputs.hash_drift_entries }} / ${{ steps.perf-corpus.outputs.error_entries }} |"
            echo "| disabled / skipped entries | ${{ steps.perf-corpus.outputs.disabled_entries }} / ${{ steps.perf-corpus.outputs.skipped_entries }} |"
            echo "| manifest | \`${{ runner.temp }}/parsecore-corpus.perf.json\` |"
            echo ""
            if [ "${{ steps.perf-corpus.outputs.available }}" != "true" ]; then
              echo "**Verification status: UNVERIFIED.** Performance tracking is skipped on this runner."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.perf-corpus.outputs.available }}" != "true" ]; then
            echo "::notice::Performance regression corpus unavailable (reason=${{ steps.perf-corpus.outputs.reason }}): ${{ steps.perf-corpus.outputs.summary }} - perf tracking skipped and recorded as UNVERIFIED."
          fi
      - name: Resolve perf history paths
        id: perf-history
        if: steps.perf-corpus.outputs.available == 'true'
        shell: python
        run: |
          import os
          from pathlib import Path

          explicit_previous = str(os.environ.get("PARSECORE_PREVIOUS_PERF_REPORT") or "").strip()
          history_dir_raw = str(os.environ.get("PARSECORE_PERF_HISTORY_DIR") or "").strip()
          compare_report = ""
          persist_report = ""

          if explicit_previous:
              explicit_path = Path(explicit_previous).expanduser()
              if explicit_path.exists():
                  compare_report = str(explicit_path)
              else:
                  print(f"::notice::PARSECORE_PREVIOUS_PERF_REPORT points to missing file: {explicit_path}")

          if history_dir_raw:
              history_dir = Path(history_dir_raw).expanduser()
              history_dir.mkdir(parents=True, exist_ok=True)
              latest_report = history_dir / "latest.perf.json"
              persist_report = str(latest_report)
              if not compare_report and latest_report.exists():
                  compare_report = str(latest_report)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"compare_report={compare_report}\n")
              handle.write(f"persist_report={persist_report}\n")

          if compare_report:
              print(f"::notice::Using previous perf report for comparison: {compare_report}")
          else:
              print("::notice::No previous perf report configured; this run will establish a fresh baseline.")
          if persist_report:
              print(f"::notice::Current perf report will be persisted to: {persist_report}")
      - name: Run perf gate
        if: steps.perf-corpus.outputs.available == 'true'
        run: |
          if [ -n "${{ steps.perf-history.outputs.compare_report }}" ]; then
            python tools/self_check.py --profile perf --out "$RUNNER_TEMP/parsecore-self-check-perf.json" --compare-report "${{ steps.perf-history.outputs.compare_report }}"
          else
            python tools/self_check.py --profile perf --out "$RUNNER_TEMP/parsecore-self-check-perf.json"
          fi
      - name: Summarize perf metrics
        if: always() && steps.perf-corpus.outputs.available == 'true'
        env:
          PERF_REPORT: ${{ runner.temp }}/parsecore-self-check-perf.json
        run: |
          if [ ! -f "$PERF_REPORT" ]; then
            echo "Perf report missing; skipping summary."
            exit 0
          fi
          python tools/perf_trend_report.py "$PERF_REPORT" --out-md "$GITHUB_STEP_SUMMARY"
      - name: Upload perf report
        if: always() && steps.perf-corpus.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: parsecore-self-check-perf
          path: ${{ runner.temp }}/parsecore-self-check-perf.json
          if-no-files-found: ignore
      - name: Persist perf report
        if: always() && steps.perf-corpus.outputs.available == 'true' && steps.perf-history.outputs.persist_report != ''
        shell: python
        env:
          PERF_REPORT: ${{ runner.temp }}/parsecore-self-check-perf.json
          PERF_PERSIST_REPORT: ${{ steps.perf-history.outputs.persist_report }}
        run: |
          import os
          import shutil
          import time
          from pathlib import Path

          source = Path(os.environ["PERF_REPORT"])
          target = Path(os.environ["PERF_PERSIST_REPORT"])
          if not source.exists():
              print(f"::notice::Perf report missing, skip persist: {source}")
              raise SystemExit(0)
          target.parent.mkdir(parents=True, exist_ok=True)
          snapshot = target.parent / f"parsecore-self-check-perf.{time.strftime('%Y%m%dT%H%M%SZ', time.gmtime())}.json"
          shutil.copy2(source, target)
          shutil.copy2(source, snapshot)
          print(f"::notice::Persisted perf report to {target}")
          print(f"::notice::Archived perf snapshot to {snapshot}")
      - name: Skip perf gate (unverified)
        if: steps.perf-corpus.outputs.available != 'true'
        run: echo "Performance regression corpus unavailable (reason=${{ steps.perf-corpus.outputs.reason }}); skipped and recorded as UNVERIFIED in the job summary."

  release:
    name: Release acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,parsers,storage]"
      - name: Require a verified regression corpus
        id: release-corpus
        run: |
          python tools/corpus_manifest.py \
            --suite var/regression/suite.full.json \
            --require-verified \
            --github-output "$GITHUB_OUTPUT" \
            --out "$RUNNER_TEMP/parsecore-corpus.release.json" \
            --verbose
      - name: Record release corpus status
        if: always()
        run: |
          {
            echo "### Release corpus: \`${{ steps.release-corpus.outputs.status }}\`"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| verified | \`${{ steps.release-corpus.outputs.verified }}\` |"
            echo "| reason | \`${{ steps.release-corpus.outputs.reason }}\` |"
            echo "| entries verified | ${{ steps.release-corpus.outputs.verified_entries }} / ${{ steps.release-corpus.outputs.selected_entries }} selected |"
            echo "| missing fixtures | ${{ steps.release-corpus.outputs.missing_fixtures }} |"
            echo "| hash_drift entries | ${{ steps.release-corpus.outputs.hash_drift_entries }} |"
            echo "| manifest | \`${{ runner.temp }}/parsecore-corpus.release.json\` |"
            echo ""
            echo "A release may only be published when the corpus is VERIFIED and the release self-check below exits 0."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run release self-check
        run: |
          python tools/self_check.py \
            --profile slow \
            --require-verified-corpus \
            --out "$RUNNER_TEMP/parsecore-self-check-release.json"
      - name: Upload release acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parsecore-release-acceptance
          path: |
            ${{ runner.temp }}/parsecore-self-check-release.json
            ${{ runner.temp }}/parsecore-corpus.release.json
          if-no-files-found: warn

  postgres-pgvector:
    name: Postgres and pgvector smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: parsecore
          POSTGRES_PASSWORD: parsecore
          POSTGRES_USER: parsecore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parsecore -d parsecore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PARSECORE_TEST_POSTGRES_URL: postgresql://parsecore:parsecore@localhost:5432/parsecore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,storage]"
      - name: Run Postgres smoke tests
        run: python -m unittest tests.test_postgres_stores
