[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parsecore-starter"
version = "0.1.0"
description = "Embedded-first parse management starter kit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
api = [
    "starlette>=1,<2",
    "uvicorn>=0.45,<1",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
]
worker = [
    "celery>=5.5,<6",
]
storage = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pgvector>=0.3,<1",
]
parsers = [
    "openpyxl>=3.1,<4",
    "pypdf>=5,<6",
    "rapidocr_onnxruntime>=1.2,<2",
    "xlrd>=2,<3",
]

[project.scripts]
parsecore = "parsecore.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
